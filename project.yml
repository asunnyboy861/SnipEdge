name: SnipEdge
options:
  bundleIdPrefix: com.zzoutuo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: JP4TN5PTS3
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
targets:
  SnipEdge:
    type: application
    platform: iOS
    sources:
      - path: SnipEdge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zzoutuo.SnipEdge
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: SnipEdge/SnipEdge.entitlements
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: GLMProxySecret.txt
    info:
      path: SnipEdge/Info.plist
      properties:
        CFBundleDisplayName: "SnipEdge: AI Chart Grades"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: "SnipEdge reads the chart screenshot you choose so it can grade the setup."
        NSCameraUsageDescription: "SnipEdge uses the camera to capture a chart screenshot for grading."
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.zzoutuo.SnipEdge
            CFBundleURLSchemes:
              - snipedge
  SnipEdgeShare:
    type: app-extension
    platform: iOS
    sources:
      - path: SnipEdgeShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zzoutuo.SnipEdge.Share
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: SnipEdgeShare/SnipEdgeShare.entitlements
    info:
      path: SnipEdgeShare/Info.plist
      properties:
        CFBundleDisplayName: SnipEdge
        LSRequiresIPhoneOS: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
